stages:
  preprocess:
    cmd: uv run python -m techchallenge_fase2.pipeline.preprocess
    deps:
      - data/raw/events.csv
      - src/techchallenge_fase2/pipeline/config.py
      - src/techchallenge_fase2/pipeline/preprocess.py
    params:
      - paths.raw_events
      - paths.processed_interactions
      - preprocess.sample_size
      - preprocess.random_seed
      - features.event_weights
    outs:
      - data/processed/interactions.parquet

  feature_eng:
    cmd: uv run python -m techchallenge_fase2.pipeline.features
    deps:
      - data/processed/interactions.parquet
      - src/techchallenge_fase2/pipeline/config.py
      - src/techchallenge_fase2/pipeline/features.py
    params:
      - paths.train_features
      - paths.validation_features
      - paths.test_features
      - paths.mappings
      - paths.dataset_stats
      - features.train_ratio
      - features.validation_ratio
      - features.session_gap_minutes
    outs:
      - data/features/train.parquet
      - data/features/validation.parquet
      - data/features/test.parquet
      - data/features/mappings.json
      - data/features/dataset_stats.json

  train:
    cmd: uv run python -m techchallenge_fase2.pipeline.training
    deps:
      - data/features/train.parquet
      - data/features/mappings.json
      - src/techchallenge_fase2/models/config.py
      - src/techchallenge_fase2/models/embedding.py
      - src/techchallenge_fase2/models/factory.py
      - src/techchallenge_fase2/pipeline/config.py
      - src/techchallenge_fase2/pipeline/training.py
    params:
      - paths.model_checkpoint
      - training.batch_size
      - training.epochs
      - training.embedding_dim
      - training.learning_rate
      - training.negative_samples
      - training.random_seed
      - evaluation.top_k
    outs:
      - models/torch_embedding_recommender.pt

  evaluate:
    cmd: uv run python -m techchallenge_fase2.pipeline.evaluation
    deps:
      - data/features/train.parquet
      - data/features/test.parquet
      - models/torch_embedding_recommender.pt
      - src/techchallenge_fase2/models/embedding.py
      - src/techchallenge_fase2/pipeline/config.py
      - src/techchallenge_fase2/pipeline/evaluation.py
      - src/techchallenge_fase2/pipeline/metrics.py
    params:
      - paths.metrics
      - evaluation.top_k
      - evaluation.max_users
    metrics:
      - metrics/recommendation_metrics.json
