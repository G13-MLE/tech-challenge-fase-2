paths:
  raw_events: data/raw/events.csv
  processed_interactions: data/processed/interactions.parquet
  train_features: data/features/train.parquet
  validation_features: data/features/validation.parquet
  test_features: data/features/test.parquet
  mappings: data/features/mappings.json
  dataset_stats: data/features/dataset_stats.json
  model_checkpoint: models/torch_embedding_recommender.pt
  checkpoint_dir: models/checkpoints
  metrics: metrics/recommendation_metrics.json

# Pipeline configurado para o dataset RetailRocket completo (>=1.4M interacoes).
# sample_size = 0 desativa a amostragem (usar o dataset real).
preprocess:
  sample_size: 0
  random_seed: 42

features:
  train_ratio: 0.70
  validation_ratio: 0.15
  session_gap_minutes: 30
  event_weights:
    view: 1.0
    addtocart: 3.0
    transaction: 5.0

# Hiperparametros ajustados para treino real do NCF no catalogo completo.
# epochs=20 com patience=5+early stopping tipicamente encerra entre 7-15 epocas.
training:
  batch_size: 1024
  epochs: 20
  embedding_dim: 64
  learning_rate: 0.001
  negative_samples: 1
  random_seed: 42
  patience: 5
  min_delta: 0.0001

# Avaliacao Top-K em 1000 usuarios (amostra representativa do conjunto de teste).
evaluation:
  top_k: 10
  max_users: 1000