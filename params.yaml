paths:
  raw_events: data/raw/events.csv
  processed_interactions: data/processed/interactions.parquet
  train_features: data/features/train.parquet
  validation_features: data/features/validation.parquet
  test_features: data/features/test.parquet
  mappings: data/features/mappings.json
  dataset_stats: data/features/dataset_stats.json
  model_checkpoint: models/torch_embedding_recommender.pt
  checkpoint_dir: models/checkpoints
  metrics: metrics/recommendation_metrics.json

# Pipeline configurado para o dataset RetailRocket filtrado aos top-10000
# itens mais populares e usuários com >=5 interações. Decisao de design
# documentada (literatura de recsys para datasets esparsos): reduz o
# catalogo de 235k para ~10k itens (tratável em 16GB RAM, viabiliza
# ItemKNN/LogReg/EASE^) e foca em usuários com histórico suficiente
# para personalização. Metricas esperadas: hit_rate@10 ~ 0.05-0.20.
# sample_size = 0 desativa a amostragem (usar o dataset real).
preprocess:
  sample_size: 0
  random_seed: 42
  max_items: 10000
  min_interactions_per_user: 5

features:
  train_ratio: 0.70
  validation_ratio: 0.15
  session_gap_minutes: 30
  event_weights:
    view: 1.0
    addtocart: 3.0
    transaction: 5.0

# Hiperparametros ajustados para treino do NCF no catalogo filtrado (10k itens).
# epoch=20 com patience=5 + early stopping; neg_samples=4 aumenta o sinal
# negativo por usuário (catalogo 10k torna o ratio viável).
training:
  batch_size: 1024
  epochs: 20
  embedding_dim: 64
  learning_rate: 0.001
  negative_samples: 4
  random_seed: 42
  patience: 5
  min_delta: 0.0001

# Avaliacao Top-K em 1000 usuários (amostra representativa do conjunto de teste).
evaluation:
  top_k: 10
  max_users: 1000
