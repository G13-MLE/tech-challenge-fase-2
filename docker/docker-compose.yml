# =============================================================================
# Docker Compose - MLflow Stack
# PostgreSQL (backend store) + MinIO (artifact store) + MLflow Server
#
# Uso:
#   make mlflow-up      # sobe a stack
#   make mlflow-down    # derruba a stack
#
# Após iniciar, acesse:
#   MLflow UI:    http://localhost:${MLFLOW_PORT:-5000}
#   MinIO Console: http://localhost:9001
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL: backend store para metadados do MLflow (runs, params, metrics)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: mlflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow_password}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mlflow-network

  # ---------------------------------------------------------------------------
  # MinIO: artifact store S3-compatible para modelos, plots e artefatos
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: mlflow-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin_secret_key}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mlflow-network

  # ---------------------------------------------------------------------------
  # MLflow Server: tracking server com Gunicorn
  # ---------------------------------------------------------------------------
  mlflow-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mlflow
    container_name: mlflow-server
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin_secret_key}
    ports:
      - "${MLFLOW_PORT:-5000}:${MLFLOW_PORT:-5000}"
    command: >
      mlflow server
      --host 0.0.0.0
      --port ${MLFLOW_PORT:-5000}
      --backend-store-uri postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow_password}@postgres:5432/${POSTGRES_DB:-mlflow_db}
      --default-artifact-root s3://mlflow-artifacts
      --artifacts-destination s3://mlflow-artifacts
      --serve-artifacts
      --gunicorn-opts "--workers ${MLFLOW_WORKERS:-2} --timeout 120"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MLFLOW_PORT:-5000}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - mlflow-network

  # ---------------------------------------------------------------------------
  # MinIO Setup: cria o bucket mlflow-artifacts e configura política de download
  # ---------------------------------------------------------------------------
  minio-setup:
    image: minio/mc:latest
    container_name: mlflow-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin_secret_key};
      mc mb minio/mlflow-artifacts --ignore-existing;
      mc anonymous set download minio/mlflow-artifacts;
      exit 0;
      "
    networks:
      - mlflow-network

volumes:
  postgres_data:
  minio_data:

networks:
  mlflow-network:
    driver: bridge