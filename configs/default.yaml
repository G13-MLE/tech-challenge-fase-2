# Configurações do pipeline de dados para o sistema de recomendação

# Paths dos dados brutos
data:
  raw_dir: data/raw
  processed_dir: data/processed
  events: data/raw/events.csv
  item_properties:
    - data/raw/item_properties_part1.csv
    - data/raw/item_properties_part2.csv
  category_tree: data/raw/category_tree.csv

# Parâmetros de sessão
session:
  gap_minutes: 30
  # Nova sessão quando:
  # 1. gap >= gap_minutes entre eventos consecutivos do mesmo visitor
  # 2. evento anterior == "transaction" E evento atual != "transaction"

# Propriedades relevantes dos itens
item_properties:
  # Propriedades diretamente usáveis (não hashed)
  special:
    - categoryid
    - available
  # Propriedades numéricas com prefixo 'n'
  numeric:
    - "790"
  # Top-N propriedades hashed por cobertura
  top_n_hashes: 50

# Parâmetros de split
split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42

# Amostragem negativa para MLP
negative_sampling:
  ratio: 4  # 4 negativos para cada 1 positivo
  seed: 42

# Parâmetros do KL divergence
kl_divergence:
  alpha: 0.5  # parâmetro de suavização

# Saídas
outputs:
  super_table: data/processed/super_table.parquet
  train: data/processed/mlp_train.parquet
  val: data/processed/mlp_val.parquet
  test: data/processed/mlp_test.parquet